<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" fill="none">
  <defs>
    <filter id="route-glow" x="-10%" y="-20%" width="120%" height="140%">
      <feGaussianBlur stdDeviation="3" />
    </filter>
  </defs>
  <style>
    @keyframes route-flow { to { stroke-dashoffset: -1000; } }
    @keyframes node-breathe { 0%, 100% { opacity: .1; } 50% { opacity: .38; } }
    .route-flow, .route-flow-glow { animation: route-flow 19s linear infinite; }
    .route-flow-branch, .route-flow-branch-glow { animation: route-flow 13s linear infinite reverse; }
    .route-node-pulse { animation: node-breathe 3.6s ease-in-out infinite; }
    .route-node-pulse--late { animation-delay: 1.8s; }
    @media (prefers-reduced-motion: reduce) {
      .route-flow, .route-flow-glow, .route-flow-branch, .route-flow-branch-glow,
      .route-node-pulse, .route-node-pulse--late { animation: none; }
    }
  </style>
  <g stroke="#FFFFFF" stroke-opacity=".12" stroke-width="1">
