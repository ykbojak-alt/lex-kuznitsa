  </g>
  <g fill="#FFD400">
    <circle class="route-node-pulse" cx="136" cy="494" r="22" />
    <circle class="route-node-pulse route-node-pulse--late" cx="481" cy="288" r="22" />
    <circle class="route-node-pulse" cx="756" cy="415" r="22" />
  </g>
  <g stroke="#FFFFFF" stroke-opacity=".38" stroke-width="2">
    <path d="M-40 494H136L207 423H344L405 484H556L625 415H756L822 349H1000"/>
    <path d="M136 494V598H248M344 423V288H481M556 484V590H665M756 415V236H866"/>
    <path d="M50 177H190L249 118H416M634 120H772L840 188H1000"/>
  </g>
  <path class="route-flow-glow" pathLength="1000" d="M-40 494H136L207 423H344L405 484H556L625 415H756L822 349H1000" stroke="#FFD400" stroke-opacity=".54" stroke-width="12" stroke-dasharray="72 928" filter="url(#route-glow)" />
  <path class="route-flow" pathLength="1000" d="M-40 494H136L207 423H344L405 484H556L625 415H756L822 349H1000" stroke="#FFD400" stroke-opacity=".94" stroke-width="3.5" stroke-dasharray="72 928" />
  <path class="route-flow-branch-glow" pathLength="1000" d="M344 423V288H481" stroke="#FFFDF7" stroke-opacity=".36" stroke-width="10" stroke-dasharray="50 950" filter="url(#route-glow)" />
  <path class="route-flow-branch" pathLength="1000" d="M344 423V288H481" stroke="#FFFDF7" stroke-opacity=".88" stroke-width="2.5" stroke-dasharray="50 950" />
  <g fill="#FFD400" stroke="#090909" stroke-width="3">
